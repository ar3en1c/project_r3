{% load static %}
<a class="t250-row" href="{% url 'movie_detail' m.slug %}">
  <span class="t250-rank">{{ rank }}</span>
  <span class="t250-img-wrap">
    <img src="{% if m.image %}{{ m.image }}{% else %}{% static 'images/missing.jpg' %}{% endif %}" alt="{{ m.name_fa|default:m.name }}" class="t250-img" loading="lazy" />
  </span>
  <span class="t250-info">
    <span class="t250-name">{{ m.name_fa|default:m.name }}</span>
    <span class="t250-year">{{ m.year }}</span>
  </span>
  <span class="t250-rate">{{ m.rate }}</span>
</a>
