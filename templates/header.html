<!-- Header -->
{% load static %}

<header class="header">
  <a href="{% url 'series:mainSeries' %}" class="logo">
    <img src="{% static 'images/logo.png' %}" alt="ونتا" class="logo-img" />
  </a>
  <nav class="nav-links">
    <a href="{% url 'mainPage' %}">خانه</a>
    <a href="{% url 'top250:top250' %}">برترین ها</a>
    <a href="{% url 'series:mainSeries' %}">سریال‌ها</a>
    <a href="{% url 'movie_list' %}">فیلم‌ها</a>
    <a href="{% url 'users:profile' %}">لیست‌های من</a>
  </nav>
  <div class="header-left">
    <button id="theme-toggle" class="theme-toggle" type="button" title="تغییر تم" aria-label="تغییر تم">
      <span class="theme-icon"></span>
    </button>
    <div class="search-bar" x-data="{ open: false }">
      <input type="text" name="q" placeholder="جستجو..."
             hx-get="{% url 'search:query' %}"
             hx-target="#search-results"
             hx-swap="innerHTML"
             hx-trigger="keyup changed delay:300ms, search"
             @focus="open = true"
             @keydown.escape="open = false"
             @blur="setTimeout(() => open = false, 150)">
      <span class="search-icon">&#128269;</span>
      <div id="search-results" class="search-results" x-show="open"></div>
  </div>
    <div class="header-auth">
      {% if user.is_authenticated %}
        <span class="user-chip" title="{{ user.username }}">
          <span class="chip-dot"></span>{{ user.username }}
        </span>
        <form method="post" action="{% url 'users:logout' %}" class="logout-form">
          {% csrf_token %}
          <button type="submit" class="auth-link-btn">خروج</button>
        </form>
      {% else %}
        <a href="{% url 'users:login' %}" class="auth-link-btn">ورود</a>
        <a href="{% url 'users:signup' %}" class="auth-signup-btn">ثبت‌نام +</a>
      {% endif %}
    </div>
  </div>
</header>

<script>
  // Dark / light theme toggle (theme itself is applied pre-paint in base.html)
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });
</script>
