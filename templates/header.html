<!-- Header -->
<header class="header">
  <a href="{% url 'series:mainSeries' %}" class="logo" style="direction: rtl;">
    <span class="logo-prompt">$</span>
    <span class="logo-name"><span class="logo-accent">ونتا</span></span>
  </a>
  <nav class="nav-links">
    <a href="{% url 'series:mainSeries' %}">سریال‌ها</a>
    <a href="#">فیلم‌ها</a>
    <a href="#">لیست‌های من</a>
    <a href="#">جستجو</a>
  </nav>
  <div class="header-left">
    <div class="search-bar">
      <input type="text" placeholder="جستجو...">
      <span class="search-icon">&#128269;</span>
    </div>
    <div class="header-auth">
      {% if user.is_authenticated %}
        <span class="user-chip" title="{{ user.username }}">
          <span class="chip-dot"></span>{{ user.username }}
        </span>
        <form method="post" action="{% url 'users:logout' %}" class="logout-form">
          {% csrf_token %}
          <button type="submit" class="auth-link-btn">خروج</button>
        </form>
      {% else %}
        <a href="{% url 'users:login' %}" class="auth-link-btn">ورود</a>
        <a href="{% url 'users:signup' %}" class="auth-signup-btn">ثبت‌نام +</a>
      {% endif %}
    </div>
  </div>
</header>
